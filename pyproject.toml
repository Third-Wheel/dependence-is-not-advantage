[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graph-dependence"
version = "0.2.0"
description = "Split a graph-randomization drop into what the graph adds and what wrong edges cost."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Prahas Duggireddy", email = "prahasduggireddy@thirdwheel.ai" },
]
keywords = [
  "graph neural networks",
  "graph ablation",
  "degree-preserving randomization",
  "edge shuffling",
  "PyTorch Geometric",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2", "torch_geometric>=2.5"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]
release = [
  "build>=1.2",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://third-wheel.github.io/dependence-is-not-advantage/"
Documentation = "https://github.com/Third-Wheel/dependence-is-not-advantage#readme"
Paper = "https://www.alphaxiv.org/abs/2608.dependence-is-not-advantage"
Repository = "https://github.com/Third-Wheel/dependence-is-not-advantage"
Issues = "https://github.com/Third-Wheel/dependence-is-not-advantage/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_dependence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]
ignore = ["N812"]  # import torch.nn.functional as F is the PyTorch convention
